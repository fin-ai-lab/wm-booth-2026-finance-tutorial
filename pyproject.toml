[project]
name = "wm-booth-2026-finance-tutorial"
version = "0.1.0"
description = "Code and notebooks for the 2026 Booth Wealth Management finance tutorial."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "datasets>=4.0",
    "huggingface-hub>=0.36",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
    "mypy>=1.14",
    "nbmake>=1.5",
    "nbstripout>=0.7",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wm_booth_2026_finance_tutorial"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["wm_booth_2026_finance_tutorial"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
