# Install once with: uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this in step with the Ruff version resolved in uv.lock.
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # Keep notebook diffs small and avoid committing generated output.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
